name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.11.2"
  MANGA_FLUENTQT_ROOT: ${{ github.workspace }}\.deps\fluentqt
  SCCACHE_GHA_ENABLED: "true"

jobs:
  windows:
    name: Windows ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Test
            preset: windows-msvc-test
            run_tests: true
          - configuration: Release
            preset: windows-msvc-release
            run_tests: false

    steps:
      - name: Check out MangaTranslator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out pinned FluentQt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: calvinhxx/Fluent-Qt
          ref: 50ad2fa1ad263c834adfd280b2c19dfdc2278dae
          path: .deps/fluentqt
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # aqtinstall 3.3.0 predates Qt 6.11's Windows repository layout.
          # Pin the merged upstream fix until aqtinstall publishes a new release.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
          cache: true

      - name: Export Qt preset path
        shell: pwsh
        run: '"QTDIR=$env:QT_ROOT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Set up MSVC 2022 x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          vsversion: 2022

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Configure
        shell: pwsh
        run: >-
          cmake --preset ${{ matrix.preset }}
          "-DFETCHCONTENT_SOURCE_DIR_FLUENTQT=$env:MANGA_FLUENTQT_ROOT"
          "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        if: matrix.run_tests
        run: ctest --preset windows-msvc-test

      - name: Upload test diagnostics
        if: failure() && matrix.run_tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-test-diagnostics
          path: build/windows-msvc-test/Testing/Temporary
          if-no-files-found: ignore
          retention-days: 7

  p4-model:
    name: P4 OCR Model Acceptance
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out MangaTranslator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out pinned FluentQt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: calvinhxx/Fluent-Qt
          ref: 50ad2fa1ad263c834adfd280b2c19dfdc2278dae
          path: .deps/fluentqt
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
          cache: true

      - name: Export Qt preset path
        shell: pwsh
        run: '"QTDIR=$env:QT_ROOT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Set up MSVC 2022 x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          vsversion: 2022

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Cache OCR Model
        id: cache-ocr-model
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: models/ocr/genshiai-baberu-ocr-onnx/1.0.0
          key: ocr-model-v1

      - name: Download OCR Model
        if: steps.cache-ocr-model.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path models/ocr/genshiai-baberu-ocr-onnx/1.0.0 -Force
          # In a real workflow, this would download the HuggingFace repo via git lfs or direct URL
          # For this CI step placeholder, we download from HF using huggingface_hub or direct curl
          pip install huggingface_hub
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='genshiai-daichi/baberu-ocr', revision='d9cc13153e9a1cd8fdfa3b7b1cc329da2020aeae', allow_patterns=['onnx/vision_fp16.onnx', 'onnx/decoder_prefill_int8.onnx', 'onnx/decoder_step_int8.onnx', 'tokenizer/vocab.json'], local_dir='models/ocr/genshiai-baberu-ocr-onnx/1.0.0')"
          # Synthesize a manifest.json representing the model
          $manifest = @{
              manifestVersion = 1
              id = "genshiai-baberu-ocr-onnx"
              version = "1.0.0"
              source = @{
                  repository = "genshiai-daichi/baberu-ocr"
                  revision = "d9cc13153e9a1cd8fdfa3b7b1cc329da2020aeae"
                  license = "Apache-2.0"
              }
              runtime = @{
                  minimumOnnxRuntime = "1.14.0"
                  opset = 14
                  executionProvider = "cpu"
              }
              input = @{
                  width = 224
                  height = 224
                  layout = "NCHW"
                  color = "RGB"
                  sourceConversion = "RGB"
                  resizeMode = "stretch"
                  resample = "bicubic"
              }
              normalization = @{
                  scale = 0.003921568
                  mean = @(0.48145466, 0.4578275, 0.40821073)
                  std = @(0.26862954, 0.26130258, 0.27577711)
              }
              generation = @{
                  maxLength = 128
                  strategy = "greedy"
                  repetitionPenalty = 1.2
                  contentRunCap = 12
              }
              postprocess = "baberu-v1"
              tokenizer = @{
                  type = "baberu-character-v1"
                  vocabFile = "tokenizer/vocab.json"
                  sha256 = (Get-FileHash "models/ocr/genshiai-baberu-ocr-onnx/1.0.0/tokenizer/vocab.json" -Algorithm SHA256).Hash.ToLower()
                  bosTokenId = 1
                  eosTokenId = 2
                  padTokenId = 0
                  unkTokenId = 3
              }
              graphs = @(
                  @{
                      role = "vision"
                      file = "onnx/vision_fp16.onnx"
                      sha256 = (Get-FileHash "models/ocr/genshiai-baberu-ocr-onnx/1.0.0/onnx/vision_fp16.onnx" -Algorithm SHA256).Hash.ToLower()
                      inputs = @("pixel_values")
                      outputs = @("vision_embeds")
                  },
                  @{
                      role = "decoder-prefill"
                      file = "onnx/decoder_prefill_int8.onnx"
                      sha256 = (Get-FileHash "models/ocr/genshiai-baberu-ocr-onnx/1.0.0/onnx/decoder_prefill_int8.onnx" -Algorithm SHA256).Hash.ToLower()
                      inputs = @("vision_embeds", "input_ids")
                      outputs = @("logits", "present_k0", "present_v0", "present_k1", "present_v1", "present_k2", "present_v2", "present_k3", "present_v3", "present_k4", "present_v4", "present_k5", "present_v5")
                  },
                  @{
                      role = "decoder-step"
                      file = "onnx/decoder_step_int8.onnx"
                      sha256 = (Get-FileHash "models/ocr/genshiai-baberu-ocr-onnx/1.0.0/onnx/decoder_step_int8.onnx" -Algorithm SHA256).Hash.ToLower()
                      inputs = @("input_ids", "position_ids", "past_k0", "past_v0", "past_k1", "past_v1", "past_k2", "past_v2", "past_k3", "past_v3", "past_k4", "past_v4", "past_k5", "past_v5")
                      outputs = @("logits", "present_k0", "present_v0", "present_k1", "present_v1", "present_k2", "present_v2", "present_k3", "present_v3", "present_k4", "present_v4", "present_k5", "present_v5")
                  }
              )
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content "models/ocr/genshiai-baberu-ocr-onnx/1.0.0/manifest.json" -Encoding UTF8

      - name: Configure
        shell: pwsh
        run: >-
          cmake --preset windows-msvc-test
          "-DFETCHCONTENT_SOURCE_DIR_FLUENTQT=$env:MANGA_FLUENTQT_ROOT"
          "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache"

      - name: Build tests
        run: cmake --build --preset windows-msvc-test --target manga_tests_services --parallel

      - name: Run OCR Integration Tests
        shell: pwsh
        run: |
          $env:MANGA_OCR_MODEL_DIR = "${{ github.workspace }}/models/ocr/genshiai-baberu-ocr-onnx/1.0.0"
          ctest --preset windows-msvc-test -R manga_tests_services --output-on-failure
