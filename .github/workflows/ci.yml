name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.11.2"
  MANGA_FLUENTQT_ROOT: ${{ github.workspace }}\.deps\fluentqt
  MANGA_VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
  MANGA_VCPKG_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache
  SCCACHE_GHA_ENABLED: "true"
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  windows:
    name: Windows ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Test
            preset: windows-msvc-test
            run_tests: true
          - configuration: Release
            preset: windows-msvc-release
            run_tests: false

    steps:
      - name: Check out MangaTranslator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out pinned vcpkg
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: microsoft/vcpkg
          ref: 6d9d7df564a1ccdaa994e4ad39ccd4a32360867b
          path: .vcpkg
          persist-credentials: false

      - name: Check out pinned FluentQt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: calvinhxx/Fluent-Qt
          ref: 50ad2fa1ad263c834adfd280b2c19dfdc2278dae
          path: .deps/fluentqt
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # aqtinstall 3.3.0 predates Qt 6.11's Windows repository layout.
          # Pin the merged upstream fix until aqtinstall publishes a new release.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
          cache: true

      - name: Export Qt preset path
        shell: pwsh
        run: '"QTDIR=$env:QT_ROOT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Set up MSVC 2022 x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          vsversion: 2022

      - name: Select pinned vcpkg
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:MANGA_VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_BINARY_CACHE=$env:MANGA_VCPKG_BINARY_CACHE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Restore vcpkg caches
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ env.MANGA_VCPKG_ROOT }}\downloads
            ${{ env.MANGA_VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-msvc2022-${{ env.QT_VERSION }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:MANGA_VCPKG_BINARY_CACHE -Force | Out-Null
          & (Join-Path $env:MANGA_VCPKG_ROOT "bootstrap-vcpkg.bat") -disableMetrics

      - name: Configure
        shell: pwsh
        run: >-
          cmake --preset ${{ matrix.preset }}
          "-DFETCHCONTENT_SOURCE_DIR_FLUENTQT=$env:MANGA_FLUENTQT_ROOT"
          "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        if: matrix.run_tests
        run: ctest --preset windows-msvc-test

      - name: Upload test diagnostics
        if: failure() && matrix.run_tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-test-diagnostics
          path: build/windows-msvc-test/Testing/Temporary
          if-no-files-found: ignore
          retention-days: 7
