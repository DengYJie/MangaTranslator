name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.11.2"
  MANGA_FLUENTQT_ROOT: ${{ github.workspace }}\.deps\fluentqt
  SCCACHE_GHA_ENABLED: "true"

jobs:
  windows:
    name: Windows ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Test
            preset: windows-msvc-test
            run_tests: true
          - configuration: Release
            preset: windows-msvc-release
            run_tests: false

    steps:
      - name: Check out MangaTranslator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out pinned FluentQt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: calvinhxx/Fluent-Qt
          ref: 50ad2fa1ad263c834adfd280b2c19dfdc2278dae
          path: .deps/fluentqt
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtimageformats
          # aqtinstall 3.3.0 predates Qt 6.11's Windows repository layout.
          # Pin the merged upstream fix until aqtinstall publishes a new release.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
          cache: true

      - name: Export Qt preset path
        shell: pwsh
        run: '"QTDIR=$env:QT_ROOT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Set up MSVC 2022 x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          vsversion: 2022

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Cache ONNX Runtime
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/${{ matrix.preset }}/_deps/onnxruntime-local
          key: onnxruntime-${{ runner.os }}-x64-1.26.0

      - name: Configure
        shell: pwsh
        run: >-
          cmake --preset ${{ matrix.preset }}
          "-DFETCHCONTENT_SOURCE_DIR_FLUENTQT=$env:MANGA_FLUENTQT_ROOT"
          "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          "-DMANGA_DOWNLOAD_ONNXRUNTIME=ON"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        if: matrix.run_tests
        run: ctest --preset windows-msvc-test

      - name: Upload test diagnostics
        if: failure() && matrix.run_tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-test-diagnostics
          path: build/windows-msvc-test/Testing/Temporary
          if-no-files-found: ignore
          retention-days: 7

  p4-model:
    name: P4 OCR Model Acceptance
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out MangaTranslator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out pinned FluentQt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: calvinhxx/Fluent-Qt
          ref: 50ad2fa1ad263c834adfd280b2c19dfdc2278dae
          path: .deps/fluentqt
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtimageformats
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
          cache: true

      - name: Export Qt preset path
        shell: pwsh
        run: '"QTDIR=$env:QT_ROOT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Set up MSVC 2022 x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          vsversion: 2022

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Cache ONNX Runtime
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/windows-msvc-test/_deps/onnxruntime-local
          key: onnxruntime-${{ runner.os }}-x64-1.26.0

      - name: Cache OCR Model
        id: cache-ocr-model
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: models/ocr/genshiai-baberu-ocr-onnx/1.0.0
          key: ocr-model-v1-d9cc13153e9a1cd8

      - name: Download OCR Model
        if: steps.cache-ocr-model.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $revision = "d9cc13153e9a1cd8fdfa3b7b1cc329da2020aeae"
          $modelRoot = "models/ocr/genshiai-baberu-ocr-onnx/1.0.0"
          $baseUrl = "https://huggingface.co/genshiai-daichi/baberu-ocr/resolve/$revision"
          $files = @(
            @{ Path = "onnx/vision_fp16.onnx"; Sha256 = "4ce333804846b23f1983376efe363c164d4624ecc6bd16f99a15a859d8423117" },
            @{ Path = "onnx/decoder_prefill_int8.onnx"; Sha256 = "4f8d28d4e5e8b6c7f3a4510663aa0a9199a7eec06bcb1dc0afb3ca571494e97f" },
            @{ Path = "onnx/decoder_step_int8.onnx"; Sha256 = "2eaf792ca70b67e55140ef0bcfbfc3c3b1e07d72ca277dcc46aae27c81f27ac8" },
            @{ Path = "tokenizer/vocab.json"; Sha256 = "681de4eb83154a397af49e2ddae4705041b12a22e16fe00860b829e889e5f47c" },
            @{ Path = "LICENSE"; Sha256 = "186332043e82fcfdbeb0b8e0e8d77b63d97ffa3dd9d91ccf7cef1377d8ab345b" }
          )
          foreach ($file in $files) {
            $destination = Join-Path $modelRoot $file.Path
            New-Item -ItemType Directory -Path (Split-Path $destination) -Force | Out-Null
            curl.exe --fail --location --retry 3 --output $destination "$baseUrl/$($file.Path)"
            if ($LASTEXITCODE -ne 0) { throw "Failed to download $($file.Path)" }
            $actual = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $file.Sha256) { throw "SHA-256 mismatch for $($file.Path)" }
          }
          Copy-Item res/models/baberu-ocr-v1.json "$modelRoot/manifest.json"

      - name: Configure
        shell: pwsh
        run: >-
          cmake --preset windows-msvc-test
          "-DFETCHCONTENT_SOURCE_DIR_FLUENTQT=$env:MANGA_FLUENTQT_ROOT"
          "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          "-DMANGA_DOWNLOAD_ONNXRUNTIME=ON"

      - name: Build tests
        run: cmake --build --preset windows-msvc-test --target manga_tests_services --parallel

      - name: Run OCR Integration Tests
        shell: pwsh
        run: |
          $env:MANGA_OCR_MODEL_DIR = "${{ github.workspace }}/models/ocr/genshiai-baberu-ocr-onnx/1.0.0"
          ctest --preset windows-msvc-test -R manga_tests_services --output-on-failure
