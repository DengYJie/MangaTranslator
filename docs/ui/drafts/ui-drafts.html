  <style>

    .editor-layout{height:100%;display:grid;grid-template-columns:238px minmax(520px,1fr) 346px}.pane{background:var(--layer);border-right:1px solid var(--line);min-height:0}.pane-head{height:52px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-weight:600}.thumb-list{padding:12px}.thumb-row{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:8px;margin-bottom:7px;border-radius:8px;color:var(--muted)}.thumb-row.active{background:rgba(124,111,242,.13);outline:1px solid rgba(169,159,255,.28);color:white}.thumb-art{height:72px;border-radius:4px;background:#eeeae4;position:relative}.thumb-art:after{content:"";position:absolute;inset:8px;border:2px solid #555}.thumb-copy{align-self:center}.thumb-copy b{display:block;margin-bottom:6px}.thumb-copy small{color:var(--dim)}.editor-center{display:grid;grid-template-rows:52px 1fr;background:#0f1116;min-width:0}.command{display:flex;align-items:center;gap:5px;padding:0 12px;background:#22242a;border-bottom:1px solid var(--line)}.tool{height:30px;padding:0 9px;border:0;border-radius:6px;background:transparent;color:var(--muted)}.tool.active{background:rgba(255,255,255,.09);color:white}.tool.primary{background:var(--accent);color:white}.divider{width:1px;height:19px;background:var(--line);margin:0 5px}.canvas{position:relative;display:grid;place-items:center;overflow:hidden;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:24px 24px}.mode-tabs{position:absolute;top:14px;display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:8px;background:#22242a}.mode-tabs span{padding:6px 12px;color:var(--dim);border-radius:5px}.mode-tabs .active{background:rgba(255,255,255,.09);color:white}.comic{width:424px;height:630px;background:#f3efe8;border:12px solid #faf8f4;box-shadow:0 22px 65px rgba(0,0,0,.55);display:grid;grid-template-columns:1f     .batch-top{display:grid;grid-template-columns:1fr 330px;gap:18px;margin-bottom:18px}.batch-summary{padding:20px}.summary-row{display:flex;align-items:end;justify-content:space-between;margin-bottom:17px}.big-number{font-size:30px;font-weight:650}.big-number small{font-size:14px;color:var(--dim);font-weight:400}.summary-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}.stat{padding:11px;border-radius:7px;background:var(--layer2)}.stat b{font-size:17px;display:block;margin-bottom:4px}.stat span{font-size:12px;color:var(--dim)}.batch-controls{padding:20px}.batch-controls .row{display:flex;gap:8px;margin-top:17px}.task-table{height:calc(100% - 310px);overflow:hidden}.table-head,.task-row{display:grid;grid-template-columns:80px minmax(180px,1fr) repeat(5,110px) 90px;align-items:center;padding:0 16px}.table-head{height:40px;color:var(--dim);font-size:12px;border-bottom:1px solid var(--line)}.task-row{height:56px;border-bottom:1px solid var(--line);color:var(--muted)}.page-mini{width:34px;height:42px;background:#eeeae4;border-radius:3px}.stage{font-size:12px}.stage.ok{color:var(--ok)}.stage.busy{color:var(--accent2)}.stage.wait{color:var(--dim)}.stage.bad{color:var(--bad)}
    /* Glossary */
    .gloss-layout{height:calc(100% - 90px);display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px}.gloss-main{display:grid;grid-template-rows:54px 1fr}.toolbar{display:flex;align-items:center;gap:8px;padding:0 13px;border-bottom:1px solid var(--line)}.search{height:34px;min-width:280px;border:1px solid var(--line2);border-radius:7px;background:#17191e;padding:0 11px;color:var(--dim);display:flex;align-items:center}.term-head,.term-row{display:grid;grid-template-columns:1.1fr 1.1fr 110px 100px 80px;align-items:center;padding:0 16px}.term-head{height:42px;color:var(--dim);font-size:12px;border-bottom:1px solid var(--line)}.term-row{height:57px;border-bottom:1px solid var(--line);color:var(--muted)}.term-row.active{background:rgba(124,111,242,.095)}.term-row b{color:white}.term-side{padding:22px;display:flex;flex-direction:column}.term-side h2{font-size:16px;margin:0 0 20px}.term-side .bottom{margin-top:auto;display:flex;justify-content:flex-end;gap:8px}.textarea{min-height:78px;padding:10px;border:1px solid var(--line2);border-radius:7px;background:#17191e;color:var(--muted)}

<body>
  <div id="root"></div>
  <script>
    const screens=["home","import","editor","batch","glossary","settings"];
    const names={home:"项目中心",import:"新建 / 导入",editor:"漫画编辑器",batch:"批量翻译",glossary:"术语库",settings:"设置"};
    const icons={home:"⌂",editor:"▣",batch:"✦",glossary:"▤",settings:"⚙"};
    const screen=new URLSearchParams(location.search).get("screen")||"home";
    const nav=(active)=>`<nav class="nav">${["home","editor","batch","glossary"].map(x=>`<button class="${active===x?"active":""}">${icons[x]}</button>`).join("")}<div class="spacer"></div><button class="${active==="settings"?"active":""}">${icons.settings}</button></nav>`;
    const settingsSurface=()=>`<nav class="nav settings-surface"><div class="surface-section">应用设置</div><button><b>⌂</b><span>常规</span></button><button><b>⌕</b><span>OCR 与检测</span></button><button class="active"><b>✦</b><span>AI 翻译</span></button><button><b>⬡</b><span>模型管理</span></button><div class="surface-section">体验</div><button><b>文</b><span>排版与字体</span></button><button><b>◐</b><span>外观</span></button><button><b>⌁</b><span>性能</span></button><button><b>◇</b><span>隐私</span></button></nav>`;
    const shell=(active,title,body,status="所有更改已保存",surface=null,showBack=false)=>`<main class="app"><header class="titlebar"><div class="title-leading">${showBack?`<button class="title-action" aria-label="返回">←</button>`:""}<button class="title-action" aria-label="导航菜单">☰</button><div class="mark">▤</div></div><div class="title"><strong>MangaTranslator</strong></div><div class="win"><i>—</i><i>□</i><i>×</i></div></header><section class="body">${surface||nav(active)}<div class="content">${body}</div></section><footer class="status"><span class="saved"><b>✓</b>${status}</span><span class="center">本地项目 · 自动保存已开启</span><span>GPU 可用 · 1.8 GB</span></footer></main>`;
